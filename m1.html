
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing Praktikum</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 60px 20px;
        }

        .container {
            background-color: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #cccccc;
        }

        h1 {
            color: #1769aa;
        }

        p {
            color: #444444;
            line-height: 1.6;
        }

        button {
            background-color: #1769aa;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Website Cloud Computing</h1>

        <p>Halo! Ini website pertama saya.</p>

        <p>
            Website ini dibuat menggunakan HTML dan akan
            di-deploy ke Microsoft Azure.
        </p>

        <button onclick="alert('Website berhasil dijalankan!')">
            Klik Saya
        </button>
    </div>
</body>
</html>
